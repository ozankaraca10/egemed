name = "egemed"
description = "EGEMED CLIX faz akışı"
init_script = "scripts/agtx/patch-worktree-config.sh {agent}"
supported_agents = ["claude", "codex", "opencode", "cursor"]
copy_files = ["AGENTS.md", "CLAUDE.md"]
clear_context_on_advance = true
cyclic = false
[artifacts]
research = ".egemed-run/research.md"
planning = ".egemed-run/plan.md"
running = ".egemed-run/summary.md"
review = ".egemed-run/review.md"
[commands]
research = "/agtx:research {task_id}"
planning = "/agtx:plan {task_id}"
running = "/agtx:execute {task_id}"
review = "/agtx:review {task_id}"
