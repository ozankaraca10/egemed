# EGEMED üretim ters vekil örneği (T32; sertleştirme T269) — egemed.ege.edu.tr
# Statik kabuk: apps/shell/dist → /srv/egemed/shell-dist (dağıtım akışı
# docs/ops/ISLETIM.md'de). API: bu ana makinede çalışan docker-compose.prod.yml
# yayımlaması (127.0.0.1:3000). TLS sertifikaları kurumca sağlanır; yollar
# yerinde değiştirilir.
# Kurulum (T269/A4): CSP'deki `__EGEMED_LRS_ORIGIN__` yer tutucusu kurum LRS uç
# noktasıyla doldurulmadan dosya kurulmaz (örn.
# `sed -i 's|__EGEMED_LRS_ORIGIN__|https://lrs.kurum.edu.tr|' nginx-egemed.conf`
# ya da envsubst); bkz. docs/ops/ISLETIM.md. ADR-004: tarayıcı doğrudan LRS'ye
# bağlanır, EGEMED ifade saklamaz.
# Dikkat: nginx `add_header` kalıtım almaz — bir location içinde yeni
# `add_header` varsa üst seviye başlıklar orada geçersizdir; bu yüzden
# güvenlik başlıkları her location'da ayrıca yazılır.
# Dikkat (T269): bu dosya conf.d include'u (http bağlamı) içindir;
# `server_tokens`, `limit_req_zone`, `limit_req_status` ve `map` yönergeleri bu
# yüzden dosyanın başındadır. Dosya bir `server` bloğu içine alınırsa bu
# yönergeler `http` bloğuna taşınmalıdır.

server_tokens off;

# Hız sınırı bölgeleri (T269; http bağlamı): api genel API, auth giriş
# başlatma (B6), media sim varlıkları (toplu indirmeye karşı). Aşımda 429.
# Kampüs NAT'ında çok öğrenci tek IP paylaşır: api/media oturum çerezi varsa
# oturuma, yoksa IP'ye göre sayılır; auth yalnız giriş başlatan uçlardadır.
map $cookie_egemed_session $egemed_rl_key {
    ""      $binary_remote_addr;
    default $cookie_egemed_session;
}
limit_req_zone $egemed_rl_key zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/m;
limit_req_zone $egemed_rl_key zone=media:10m rate=30r/s;
limit_req_status 429;

# AI tarayıcı/bot sınıflandırması (T269/A4): UA eşleşmesi büyük/küçük harf
# duyarsızdır. 1 olan istekler location'larda 403 ile durdurulur; istisna
# `location = /robots.txt` (botlar kapalılık direktifini okuyabilmeli).
map $http_user_agent $egemed_ai_bot {
    default 0;
    ~*GPTBot 1;
    ~*ChatGPT-User 1;
    ~*OAI-SearchBot 1;
    ~*ClaudeBot 1;
    ~*Claude-Web 1;
    ~*anthropic-ai 1;
    ~*CCBot 1;
    ~*Google-Extended 1;
    ~*PerplexityBot 1;
    ~*Perplexity-User 1;
    ~*Bytespider 1;
    ~*Amazonbot 1;
    ~*Applebot-Extended 1;
    ~*meta-externalagent 1;
    ~*Meta-ExternalAgent 1;
    ~*FacebookBot 1;
    ~*Diffbot 1;
    ~*cohere-ai 1;
    ~*Omgilibot 1;
    ~*ImagesiftBot 1;
    ~*YouBot 1;
    ~*Timpibot 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name egemed.ege.edu.tr;

    # Yalnız HTTPS; ACME http-01 zorlaması gerekiyorsa kurum proxy'siyle uyumlu
    # biçimde ayarlanır. AI bot engeli burada uygulanmaz; istek HTTPS'te durur.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name egemed.ege.edu.tr;

    ssl_certificate     /etc/nginx/ssl/egemed.ege.edu.tr.crt;
    ssl_certificate_key /etc/nginx/ssl/egemed.ege.edu.tr.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /srv/egemed/shell-dist;
    index index.html;

    # Admin CSV içe aktarmaları gibi gövdeler için sınır (ops kararı).
    client_max_body_size 10m;

    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    # ngx_brotli modülü kuruluysa ek olarak brotli açılabilir (gzip yedeği kalır):
    # brotli on;
    # brotli_comp_level 5;
    # brotli_types text/css application/javascript application/json image/svg+xml;

    # robots.txt (T269): nginx'ten düz metin; tüm botlar kapalı, AI UA'ları
    # ayrıca açıkça listelenir. Bot engeli burada uygulanmaz ki direktif
    # okunabilsin; gövde satırları bilerek girintisizdir (yanıta aynen geçer).
    location = /robots.txt {
        default_type text/plain;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, noai, noimageai" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        return 200 "User-agent: *
Disallow: /

User-agent: GPTBot
Disallow: /

User-agent: ChatGPT-User
Disallow: /

User-agent: OAI-SearchBot
Disallow: /

User-agent: ClaudeBot
Disallow: /

User-agent: Claude-Web
Disallow: /

User-agent: anthropic-ai
Disallow: /

User-agent: CCBot
Disallow: /

User-agent: Google-Extended
Disallow: /

User-agent: PerplexityBot
Disallow: /

User-agent: Perplexity-User
Disallow: /

User-agent: Bytespider
Disallow: /

User-agent: Amazonbot
Disallow: /

User-agent: Applebot-Extended
Disallow: /

User-agent: meta-externalagent
Disallow: /

User-agent: Meta-ExternalAgent
Disallow: /

User-agent: FacebookBot
Disallow: /

User-agent: Diffbot
Disallow: /

User-agent: cohere-ai
Disallow: /

User-agent: Omgilibot
Disallow: /

User-agent: ImagesiftBot
Disallow: /

User-agent: YouBot
Disallow: /

User-agent: Timpibot
Disallow: /
";
    }

    # Hash'li (içerik adresli) derleme varlıkları — yıl boyu önbellek.
    location /assets/ {
        if ($egemed_ai_bot) { return 403; }
        limit_req zone=media burst=60;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, noai, noimageai" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        try_files $uri =404;
    }

    # Sim varlıkları — kabuğun kendisinin gömdüğü aynı menşeli iframe
    # dokümanları; burada frame-ancestors 'self' geçerlidir, X-Frame-Options
    # konmaz (kendi çerçevemizi de engellerdi).
    location /sims/ {
        if ($egemed_ai_bot) { return 403; }
        limit_req zone=media burst=60;
        add_header Cache-Control "public, max-age=604800" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, noai, noimageai" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        try_files $uri =404;
    }

    # Giriş başlatan uçlar — IP başına sıkı sınır (B6). `/api/auth/me` her rota
    # değişiminde çağrıldığı için burada DEĞİL, genel /api/ bölgesindedir.
    # Düzenli ifade location'ı /api/ önekinden önce eşleşir; önek soyulur:
    # /api/auth/sso/start → /auth/sso/start.
    location ~ ^/api/auth/(sso/start|sso/callback|dev/login)$ {
        if ($egemed_ai_bot) { return 403; }
        limit_req zone=auth burst=30 nodelay;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # API yanıtları kendi güvenlik başlıklarını taşır (apps/api/src/app.ts);
        # burada çift yazılmaz, yalnız HSTS hatırlatılır. Ek başlıklar (T269)
        # API'de yoktur, bu yüzden burada verilir.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, noai, noimageai" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
    }

    # API — öneki soyulur: /api/health → /health
    location /api/ {
        if ($egemed_ai_bot) { return 403; }
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # API yanıtları kendi güvenlik başlıklarını taşır (apps/api/src/app.ts);
        # burada çift yazılmaz, yalnız HSTS hatırlatılır. Ek başlıklar (T269)
        # API'de yoktur, bu yüzden burada verilir.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, noai, noimageai" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
    }

    # index.html asla önbelleklenmez; SPA rotaları fallback'e düşer.
    location = /index.html {
        if ($egemed_ai_bot) { return 403; }
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, noai, noimageai" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; connect-src 'self' __EGEMED_LRS_ORIGIN__; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }

    location / {
        if ($egemed_ai_bot) { return 403; }
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, noai, noimageai" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; connect-src 'self' __EGEMED_LRS_ORIGIN__; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri $uri/ /index.html;
    }
}
