# EGEMED üretim ters vekil örneği (T32) — egemed.ege.edu.tr
# Statik kabuk: apps/shell/dist → /srv/egemed/shell-dist (dağıtım akışı
# docs/ops/ISLETIM.md'de). API: bu ana makinede çalışan docker-compose.prod.yml
# yayımlaması (127.0.0.1:3000). TLS sertifikaları kurumca sağlanır; yollar
# yerinde değiştirilir. CSP'deki connect-src LRS adresi (lrs.ornek-kurum.edu.tr)
# kurum LRS uç noktasıyla değiştirilir (ADR-004; tarayıcı LRS'ye bağlanır,
# EGEMED ifade saklamaz).
# Dikkat: nginx `add_header` kalıtım almaz — bir location içinde yeni
# `add_header` varsa üst seviye başlıklar orada geçersizdir; bu yüzden
# güvenlik başlıkları her location'da ayrıca yazılır.

server {
    listen 80;
    listen [::]:80;
    server_name egemed.ege.edu.tr;

    # Yalnız HTTPS; ACME http-01 zorlaması gerekiyorsa kurum proxy'siyle uyumlu
    # biçimde ayarlanır.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name egemed.ege.edu.tr;

    ssl_certificate     /etc/nginx/ssl/egemed.ege.edu.tr.crt;
    ssl_certificate_key /etc/nginx/ssl/egemed.ege.edu.tr.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /srv/egemed/shell-dist;
    index index.html;

    # Admin CSV içe aktarmaları gibi gövdeler için sınır (ops kararı).
    client_max_body_size 10m;

    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    # ngx_brotli modülü kuruluysa ek olarak brotli açılabilir (gzip yedeği kalır):
    # brotli on;
    # brotli_comp_level 5;
    # brotli_types text/css application/javascript application/json image/svg+xml;

    # Hash'li (içerik adresli) derleme varlıkları — yıl boyu önbellek.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri =404;
    }

    # Sim varlıkları — kabuğun kendisinin gömdüğü aynı menşeli iframe
    # dokümanları; burada frame-ancestors 'self' geçerlidir, X-Frame-Options
    # konmaz (kendi çerçevemizi de engellerdi).
    location /sims/ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        try_files $uri =404;
    }

    # API — öneki soyulur: /api/health → /health
    location /api/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # API yanıtları kendi güvenlik başlıklarını taşır (apps/api/src/app.ts);
        # burada çift yazılmaz, yalnız HSTS hatırlatılır.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    }

    # index.html asla önbelleklenmez; SPA rotaları fallback'e düşer.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; connect-src 'self' https://lrs.ornek-kurum.edu.tr; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; connect-src 'self' https://lrs.ornek-kurum.edu.tr; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri $uri/ /index.html;
    }
}
